# Production compose for VPS — build images locally on the host.
#
#   App  → https://mailer.starlightlinearled.com          (Caddy → starlight-mailer-web:80)
#   API  → https://api.mailer.starlightlinearled.com      (Caddy → starlight-mailer-api:7860)
#   DB   → internal pgvector (no host ports). Override DATABASE_URL in .env to use Neon instead.
#
# Caddy owns 80/443 — this stack only joins deploy_default (no host port binds).
#
# Usage (from /opt/starlight/mailer on the VPS):
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
#   cp deploy/mailer-web.caddy deploy/mailer-api.caddy /opt/technoventor/edge/sites/
#   docker exec mis-vps-caddy-1 caddy reload --config /etc/caddy/Caddyfile
#
# Note: /opt/technoventor/edge is the shared host edge (Caddy), not a Starlight product path.

name: starlight-mailer

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: starlight-mailer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: starlight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: starlight
    volumes:
      - mailer_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - deploy_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlight -d starlight"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: starlight-mailer-api:latest
    container_name: starlight-mailer-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SAAS_MODE: ${SAAS_MODE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-https://mailer.starlightlinearled.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mailer.starlightlinearled.com}
      DATABASE_URL: ${DATABASE_URL:-postgresql://starlight:${POSTGRES_PASSWORD}@starlight-mailer-db:5432/starlight}
      BLOB_BACKEND: local
      STATIC_SERVER_URL: ${STATIC_SERVER_URL:-https://api.mailer.starlightlinearled.com/media}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.mailer.starlightlinearled.com}
    volumes:
      - mailer_data:/app/data
      - mailer_attachments:/app/static/attachments
      - mailer_page_images:/app/static/page_images
      - mailer_chroma:/app/chroma_db
    expose:
      - "7860"
    networks:
      - deploy_default
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:7860/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.mailer.starlightlinearled.com}
    image: starlight-mailer-web:latest
    container_name: starlight-mailer-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - deploy_default
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mailer_pgdata:
    name: starlight-mailer_pgdata
  mailer_data:
    name: starlight-mailer_data
  mailer_attachments:
    name: starlight-mailer_attachments
  mailer_page_images:
    name: starlight-mailer_page_images
  mailer_chroma:
    name: starlight-mailer_chroma

networks:
  deploy_default:
    external: true
